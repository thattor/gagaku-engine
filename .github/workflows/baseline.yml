name: Baseline regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test-only dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Existing gagaku and score regressions
        run: python -m unittest discover -s features/gagaku -t . -v
      - name: Existing evaluator and rights-corpus regressions
        run: python -m unittest features.gagaku.tests.test_evaluate features.gagaku.references.test_corpus -v
