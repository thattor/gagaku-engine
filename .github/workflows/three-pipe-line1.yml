name: Three-pipe line1 candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  line1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest features.gagaku.product.test_three_pipe_line1 -v
      - run: python -m features.gagaku.product.three_pipe_line1 --output-dir output/three-pipe-line1-v1
      - uses: actions/upload-artifact@v4
        with:
          name: three-pipe-line1-v1
          path: output/three-pipe-line1-v1
