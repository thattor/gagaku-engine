name: Ryuteki source-column adoption
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest features.gagaku.product.test_ryuteki_source_adoption -v
      - run: python -m features.gagaku.product.ryuteki_source_adoption --output-dir output/ryuteki-source-adoption-v1
      - uses: actions/upload-artifact@v4
        with:
          name: ryuteki-source-adoption-v1
          path: output/ryuteki-source-adoption-v1
