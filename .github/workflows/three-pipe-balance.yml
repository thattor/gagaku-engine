name: Three-pipe balance player
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest features.gagaku.product.test_three_pipe_balance -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node features/gagaku/product/test_balance_player.cjs
      - run: python -m features.gagaku.product.three_pipe_pass --output-dir output/three-pipe-pass-v1
      - run: python -m features.gagaku.product.three_pipe_balance --source-dir output/three-pipe-pass-v1 --output-dir output/three-pipe-balance-v1
      - run: node features/gagaku/product/test_balance_player.cjs output/three-pipe-balance-v1
      - uses: actions/upload-artifact@v4
        with:
          name: three-pipe-balance-v1
          path: output/three-pipe-balance-v1
