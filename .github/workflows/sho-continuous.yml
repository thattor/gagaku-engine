name: Sho continuous candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest features.gagaku.product.test_sho_continuous -v
      - run: python -m features.gagaku.product.sho_continuous --output-dir output/sho-continuous-v1
      - uses: actions/upload-artifact@v4
        with:
          name: sho-continuous-v1
          path: output/sho-continuous-v1
